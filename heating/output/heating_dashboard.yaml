  - type: markdown
    content: |-
      **How it works:** inside a time block a room is on ☀️ **Day**. Outside the blocks it follows its mode: *Day / Night* → 🌙 Night, *Day / Eco* → 🍃 Eco, *On / Off* → ⏻ Off, *Eco / Eco* = always eco. *No schedule* = Home Assistant does not control this room.

      **Public holidays** (Workday integration + the "Heating holidays" calendar, where you can add bridge days): rooms follow their **Sunday** blocks. **Vacation**: turn on the switch, or fill in start and end under "Add exception". While an event runs, all scheduled rooms are on 🌙 Night.

      **Edit time blocks:** click a room in the week schedule or "Edit" under "Schedule setup": drag over a day to add a block, click a block to change or delete it, then **Update**.

      **Manual override:** a change on a wall panel, in the TeleTask app or with the buttons on the first tab stays until the next switch (start or end of a block, vacation, other mode). Then the room follows its schedule again, also when the thermostat was turned off. Rooms on *No schedule* are never touched.
