      | Room | Thermostat | ☀️ Day °C | 🌙 Night °C | 🍃 Eco °C | Since |
      |:--|:--|--:|--:|--:|--:|
      {% for name, k in rooms %}{% set p = 'sensor.heating_presets_' ~ k %}{% set st = 'sensor.heating_preset_' ~ k %}| {{ name }} | {{ {'Day': '☀️ Day', 'Night': '🌙 Night', 'Eco': '🍃 Eco', 'Manual': '✋ Manual', 'Off': '⏻ Off'}.get(states(st), states(st)) }} | {{ state_attr(p, 'day') }} | {{ state_attr(p, 'night') }} | {{ state_attr(p, 'eco') }} | {% if states[st] is not none %}{% set t = states[st].last_changed | as_local %}{{ ['mo', 'tu', 'we', 'th', 'fr', 'sa', 'su'][t.weekday()] }} {{ t.strftime('%H:%M') }}{% endif %} |
      {% endfor %}
