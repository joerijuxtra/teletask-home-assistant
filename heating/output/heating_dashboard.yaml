- title: Schedules
  path: schedules
  icon: mdi:calendar-clock
  cards:
  - type: conditional
    conditions:
    - condition: state
      entity: binary_sensor.heating_vacation_active
      state: 'on'
    card:
      type: markdown
      content: '<ha-alert alert-type="warning" title="✈️ ON VACATION">Vacation has priority: all rooms with a schedule are on night, the time blocks are not followed.</ha-alert>'
  - type: entities
    title: Schedules
    show_header_toggle: false
    entities:
    - entity: input_boolean.heating_schedules_active
      name: Schedules active
    - entity: input_boolean.heating_vacation
      name: Vacation now (scheduled rooms on night)
    - entity: calendar.heating_exceptions
      name: Vacation according to calendar
    - entity: binary_sensor.heating_holiday
      name: Public holiday today (Sunday blocks)
  - type: calendar
    title: Vacations and holidays
    initial_view: listWeek
    entities:
    - calendar.heating_exceptions
    - calendar.heating_holidays
  - type: entities
    title: Add exception
    show_header_toggle: false
    entities:
    - entity: input_datetime.heating_exception_start
      name: Start
    - entity: input_datetime.heating_exception_end
      name: End
    - entity: input_text.heating_exception_description
      name: Description
    - type: button
      icon: mdi:calendar-plus
      name: Add to calendar
      action_name: Add
      tap_action:
        action: perform-action
        perform_action: script.heating_add_exception
    - type: button
      icon: mdi:calendar-edit
      name: Change or delete (calendar)
      action_name: Open
      tap_action:
        action: navigate
        navigation_path: /calendar
  - type: markdown
    title: Schedule per room
    content: |-
      {% set rooms = [('Living & kitchen', 'living_kitchen'), ('Office 1', 'office_1'), ('Office 2', 'office_2'), ('Bedroom 1', 'bedroom_1'), ('Bedroom 2', 'bedroom_2'), ('Bedroom 3', 'bedroom_3'), ('Bathroom 1', 'bathroom_1'), ('Bathroom 2', 'bathroom_2')] %}
      | Room | Mode | Schedule wants | Next switch |
      |:--|:--|:--|--:|
      {% for name, k in rooms %}{% set s = 'schedule.heating_' ~ k %}{% set m = states('input_select.heating_mode_' ~ k) %}| {{ name }} | {{ m }} | {% if m == 'No schedule' %}–{% elif is_state('input_boolean.heating_vacation', 'on') or is_state('calendar.heating_exceptions', 'on') %}🌙 Night (vacation){% else %}{% set parts = m.split(' / ') %}{% set block = is_state('binary_sensor.heating_in_block_' ~ k, 'on') %}{% set w = parts[0] if block else parts[-1] %}{{ {'Day': '☀️ Day', 'On': '☀️ Day', 'Night': '🌙 Night', 'Eco': '🍃 Eco', 'Off': '⏻ Off'}.get(w, w) }} ({{ 'in block' if block else 'outside block' }}){% endif %} | {% set n = state_attr(s, 'next_event') %}{% if n and m != 'No schedule' %}{% set t = (as_datetime(n) if n is string else n) | as_local %}{{ ['mo', 'tu', 'we', 'th', 'fr', 'sa', 'su'][t.weekday()] }} {{ t.strftime('%H:%M') }}{% else %}–{% endif %} |
      {% endfor %}

      {% if is_state('binary_sensor.heating_holiday', 'on') %}🎉 **Public holiday today**: the rooms follow their Sunday blocks; "Next switch" shows the normal schedule.{% endif %}
      {% if is_state('input_boolean.heating_schedules_active', 'off') %}⚠️ **Schedules are off**: Home Assistant controls no room.{% endif %}
  - type: markdown
    title: Week schedule per room (time blocks = ☀️ inside block)
    content: |-
      {{ state_attr('sensor.heating_schedules', 'table') }}

      *Click a room to edit its time blocks. Public holidays follow the **su** column.*
  - type: entities
    title: Schedule setup
    show_header_toggle: false
    entities:
    - type: button
      icon: mdi:calendar-clock
      name: Living & kitchen – time blocks
      action_name: Edit
      tap_action:
        action: navigate
        navigation_path: /heating/schedules?more-info-entity-id=schedule.heating_living_kitchen&more-info-view=settings
    - entity: input_select.heating_mode_living_kitchen
      name: Living & kitchen – mode
      icon: mdi:blank
      tap_action:
        action: none
    - type: divider
    - type: button
      icon: mdi:calendar-clock
      name: Office 1 – time blocks
      action_name: Edit
      tap_action:
        action: navigate
        navigation_path: /heating/schedules?more-info-entity-id=schedule.heating_office_1&more-info-view=settings
    - entity: input_select.heating_mode_office_1
      name: Office 1 – mode
      icon: mdi:blank
      tap_action:
        action: none
    - type: divider
