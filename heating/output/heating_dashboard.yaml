# Heating dashboard (3 tabs). GENERATED by generate.py from rooms.yaml.
# New dashboard -> ⋮ -> Edit -> ⋮ -> Raw configuration editor -> paste.
# Needs the apexcharts-card (HACS) for the charts tab.
title: Heating
views:
- title: Rooms
  path: rooms
  icon: mdi:radiator
  cards:
  - type: conditional
    conditions:
    - condition: state
      entity: binary_sensor.heating_vacation_active
      state: 'on'
    card:
      type: markdown
      content: <ha-alert alert-type="warning" title="✈️ ON VACATION">All rooms with a schedule are on 🌙 Night. Turn it off on the Schedules tab.</ha-alert>
  - type: vertical-stack
    cards:
    - type: thermostat
      entity: climate.teletask_1_sensor_3
      name: Living & kitchen
      features:
      - type: climate-hvac-modes
        hvac_modes:
        - heat
        - 'off'
    - type: markdown
      content: '{% set e = ''climate.teletask_1_sensor_3'' %}{% set p = state_attr(e, ''preset_mode'') %}{% set a = state_attr(e, ''hvac_action'') %}{% if is_state(e, ''off'') %}⏻ Off · 🌡 Measured {{ state_attr(e, ''current_temperature'') }} °C{% else %}🎯 **Target {{ state_attr(e, ''temperature'') }} °C** · 🌡 Measured {{ state_attr(e, ''current_temperature'') }} °C<br>{{ {''Day'': ''☀️ Day'', ''Night'': ''🌙 Night'', ''Eco'': ''🍃 Eco''}.get(p, ''✋ Manual'') }} · {{ {''heating'': ''🔥 Heating'', ''idle'': ''💤 Idle''}.get(a, '''') }}{% endif %}'
    - type: horizontal-stack
      cards:
      - type: button
        entity: binary_sensor.heating_preset_living_kitchen_manual
        name: Manual
        icon: mdi:hand-back-right
        icon_height: 28px
        show_state: false
        state_color: true
        tap_action:
          action: perform-action
          perform_action: climate.set_preset_mode
          data:
            entity_id: climate.teletask_1_sensor_3
            preset_mode: Manual
        hold_action:
          action: none
      - type: button
        entity: binary_sensor.heating_preset_living_kitchen_day
        name: Day
        icon: mdi:weather-sunny
        icon_height: 28px
        show_state: false
        state_color: true
        tap_action:
          action: perform-action
          perform_action: climate.set_preset_mode
          data:
            entity_id: climate.teletask_1_sensor_3
            preset_mode: Day
        hold_action:
          action: none
      - type: button
        entity: binary_sensor.heating_preset_living_kitchen_night
        name: Night
        icon: mdi:weather-night
        icon_height: 28px
        show_state: false
        state_color: true
        tap_action:
          action: perform-action
          perform_action: climate.set_preset_mode
          data:
            entity_id: climate.teletask_1_sensor_3
            preset_mode: Night
        hold_action:
          action: none
      - type: button
        entity: binary_sensor.heating_preset_living_kitchen_eco
        name: Eco
        icon: mdi:leaf
        icon_height: 28px
        show_state: false
        state_color: true
        tap_action:
          action: perform-action
          perform_action: climate.set_preset_mode
          data:
            entity_id: climate.teletask_1_sensor_3
