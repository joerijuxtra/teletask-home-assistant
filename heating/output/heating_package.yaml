automation:
- id: heating_schedule_control
  alias: 'Heating: room schedules → thermostats'
  description: 'Per room: inside a block of schedule.heating_<room> (Sunday blocks on a public holiday) the first part of input_select.heating_mode_<room>, outside the second part. ''No schedule'' = not controlled. Vacation (input_boolean.heating_vacation or an event in calendar.heating_exceptions) = night for all scheduled rooms. Changes made on a wall panel or in an app stay until the next switch.'
  mode: queued
  max: 20
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.heating_in_block_living_kitchen
    - binary_sensor.heating_in_block_office_1
    - binary_sensor.heating_in_block_office_2
    - binary_sensor.heating_in_block_bedroom_1
    - binary_sensor.heating_in_block_bedroom_2
    - binary_sensor.heating_in_block_bedroom_3
    - binary_sensor.heating_in_block_bathroom_1
    - binary_sensor.heating_in_block_bathroom_2
    from:
    - 'on'
    - 'off'
    to:
    - 'on'
    - 'off'
  - trigger: state
    entity_id: calendar.heating_exceptions
    from:
    - 'on'
    - 'off'
    to:
    - 'on'
    - 'off'
  - trigger: state
    entity_id:
    - input_select.heating_mode_living_kitchen
    - input_select.heating_mode_office_1
    - input_select.heating_mode_office_2
    - input_select.heating_mode_bedroom_1
    - input_select.heating_mode_bedroom_2
    - input_select.heating_mode_bedroom_3
    - input_select.heating_mode_bathroom_1
    - input_select.heating_mode_bathroom_2
  - trigger: state
    entity_id:
    - input_boolean.heating_schedules_active
    - input_boolean.heating_vacation
    from:
    - 'on'
    - 'off'
    to:
    - 'on'
    - 'off'
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.heating_schedules_active
    state: 'on'
  actions:
  - variables:
      rooms:
      - slug: living_kitchen
        climate: climate.teletask_1_sensor_3
      - slug: office_1
        climate: climate.teletask_1_sensor_9
      - slug: office_2
        climate: climate.teletask_1_sensor_1
      - slug: bedroom_1
        climate: climate.teletask_1_sensor_4
      - slug: bedroom_2
        climate: climate.teletask_1_sensor_5
      - slug: bedroom_3
        climate: climate.teletask_1_sensor_6
      - slug: bathroom_1
        climate: climate.teletask_1_sensor_7
      - slug: bathroom_2
        climate: climate.teletask_1_sensor_2
      selection: |-
        {% set t = trigger.entity_id if trigger.entity_id is defined else '' %}
        {% set slug = t.split('.')[-1] | replace('heating_mode_', '') | replace('heating_in_block_', '') %}
        {% set m = rooms | selectattr('slug', 'eq', slug) | list %}
        {{ m if m | count > 0 else rooms }}
  - repeat:
      for_each: '{{ selection }}'
      sequence:
      - variables:
          c: '{{ repeat.item.climate }}'
          mode: '{{ states(''input_select.heating_mode_'' ~ repeat.item.slug) }}'
          target: |-
            {% set stand = {'Day': 'Day', 'On': 'Day', 'Night': 'Night', 'Eco': 'Eco', 'Off': 'off'} %}
            {% set parts = mode.split(' / ') %}
            {% if parts | count != 2 or parts[0] not in stand or parts[1] not in stand %}none
            {% elif is_state('input_boolean.heating_vacation', 'on') or is_state('calendar.heating_exceptions', 'on') %}Night
            {% elif is_state('binary_sensor.heating_in_block_' ~ repeat.item.slug, 'on') %}{{ stand[parts[0]] }}
            {% else %}{{ stand[parts[1]] }}{% endif %}
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ target == ''off'' and has_value(c) and not is_state(c, ''off'') }}'
          sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: '{{ c }}'
            data:
              hvac_mode: 'off'
        - conditions:
          - condition: template
            value_template: '{{ target in [''Day'', ''Night'', ''Eco''] and has_value(c) }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ is_state(c, ''off'') }}'
            then:
            - action: climate.set_hvac_mode
              target:
                entity_id: '{{ c }}'
              data:
                hvac_mode: heat
            - delay: 00:00:03
          - if:
            - condition: template
              value_template: '{{ state_attr(c, ''preset_mode'') != target }}'
            then:
            - action: climate.set_preset_mode
              target:
                entity_id: '{{ c }}'
              data:
                preset_mode: '{{ target }}'
- id: heating_pump_alert
  alias: 'Heating: pump runs without heat demand'
  description: The circulation pump runs for 15 min while no valve is open.
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.heating_pump_without_demand
    from: 'off'
    to: 'on'
    id: problem
  - trigger: state
    entity_id: binary_sensor.heating_pump_without_demand
    from: 'on'
    to: 'off'
    id: solved
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: problem
      sequence:
      - action: notify.notify
        data:
          title: 🔥 Heating pump without demand
          message: 'The circulation pump has been running for 15 min while no valve is open. Runtime today: {{ states(''sensor.heating_pump_runtime_today'') }} h.'
          data:
            tag: heating_pump_without_demand
    - conditions:
      - condition: trigger
        id: solved
      sequence:
      - action: notify.notify
        data:
          message: clear_notification
          data:
            tag: heating_pump_without_demand
- id: heating_vacation_flag
  alias: 'Heating: vacation → TeleTask flag 15'
  description: Keeps flag 15 equal to binary_sensor.heating_vacation_active, also after a reconnect of the flag. A PROSOFT logic function can show a message on a wall panel.
  mode: restart
  triggers:
  - trigger: state
    entity_id: binary_sensor.heating_vacation_active
    to:
    - 'on'
    - 'off'
  - trigger: state
    entity_id: switch.teletask_1_flag_15
    to:
    - 'on'
    - 'off'
  - trigger: homeassistant
    event: start
  conditions:
  - condition: template
    value_template: |-
      {{ has_value('binary_sensor.heating_vacation_active') and has_value('switch.teletask_1_flag_15')
         and states('switch.teletask_1_flag_15') != states('binary_sensor.heating_vacation_active') }}
  actions:
  - action: switch.turn_{{ states('binary_sensor.heating_vacation_active') }}
    target:
      entity_id: switch.teletask_1_flag_15
script:
  heating_add_exception:
    alias: 'Heating: add exception (vacation) to the calendar'
    icon: mdi:calendar-plus
    mode: single
    sequence:
    - variables:
        start: '{{ states(''input_datetime.heating_exception_start'') }}'
        end: '{{ states(''input_datetime.heating_exception_end'') }}'
        description: '{{ states(''input_text.heating_exception_description'') | default(''Vacation'', true) }}'
    - if:
      - condition: template
        value_template: |-
          {{ as_datetime(end) is none or as_datetime(start) is none
             or as_datetime(end) <= as_datetime(start) }}
      then:
      - action: persistent_notification.create
        data:
          notification_id: heating_exception
          title: Heating exception not added
          message: The end ({{ end }}) must be after the start ({{ start }}).
      - stop: invalid period
    - action: calendar.create_event
      target:
        entity_id: calendar.heating_exceptions
      data:
        summary: '{{ description }}'
        start_date_time: '{{ start }}'
        end_date_time: '{{ end }}'
    - action: persistent_notification.create
      data:
        notification_id: heating_exception
        title: Heating exception added
        message: '{{ description }}: {{ start }} → {{ end }}. All scheduled rooms are on night then.'
