mqtt:
  sensor:
  - name: Heating presets Living & kitchen
    unique_id: heating_presets_living_kitchen
    state_topic: teletask2mqtt/1/sensor/3/state
    value_template: '{{ value_json.day_preset_temperature }}'
    unit_of_measurement: °C
    device_class: temperature
    json_attributes_topic: teletask2mqtt/1/sensor/3/state
    json_attributes_template: |-
      {{ {'day': value_json.day_preset_temperature,
          'night': value_json.night_at_heating_preset_temperature,
          'eco': ((value_json.day_preset_temperature | float(0))
