template:
- binary_sensor:
  - name: Heating holiday
    unique_id: heating_holiday
    icon: mdi:party-popper
    state: |-
      {{ now().weekday() < 5 and (is_state('binary_sensor.workday_sensor', 'off')
         or is_state('calendar.heating_holidays', 'on')) }}
- triggers:
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id:
    - binary_sensor.heating_holiday
    - schedule.heating_living_kitchen
    - schedule.heating_office_1
    - schedule.heating_office_2
    - schedule.heating_bedroom_1
    - schedule.heating_bedroom_2
    - schedule.heating_bedroom_3
    - schedule.heating_bathroom_1
    - schedule.heating_bathroom_2
  actions:
  - action: schedule.get_schedule
    target:
      entity_id:
      - schedule.heating_living_kitchen
      - schedule.heating_office_1
      - schedule.heating_office_2
      - schedule.heating_bedroom_1
      - schedule.heating_bedroom_2
      - schedule.heating_bedroom_3
      - schedule.heating_bathroom_1
      - schedule.heating_bathroom_2
    response_variable: schedule
  - variables:
      in_block: |-
        {% set holiday = is_state('binary_sensor.heating_holiday', 'on') %}
        {% set now_t = now().strftime('%H:%M:%S') %}
        {% set ns = namespace(rooms=[]) %}
        {% for k in ['living_kitchen', 'office_1', 'office_2', 'bedroom_1', 'bedroom_2', 'bedroom_3', 'bathroom_1', 'bathroom_2'] %}
          {% set e = 'schedule.heating_' ~ k %}
          {% if not holiday %}
            {% if is_state(e, 'on') %}{% set ns.rooms = ns.rooms + [k] %}{% endif %}
          {% else %}
            {# public holiday on a weekday: use the Sunday blocks #}
            {% for b in schedule.get(e, {}).get('sunday', []) %}
              {# from/to are time objects, not strings; an end of 24:00 is 23:59:59 #}
              {% set start = (b['from'] | string)[:8] %}
              {% set end = (b['to'] | string)[:8] %}
              {% set end = '24:00:00' if end in ['00:00:00', '23:59:59'] else end %}
              {% if start <= now_t < end and k not in ns.rooms %}{% set ns.rooms = ns.rooms + [k] %}{% endif %}
            {% endfor %}
          {% endif %}
        {% endfor %}
        {{ ns.rooms }}
      table: |-
        {%- set rooms = [('Living & kitchen', 'living_kitchen'), ('Office 1', 'office_1'), ('Office 2', 'office_2'), ('Bedroom 1', 'bedroom_1'), ('Bedroom 2', 'bedroom_2'), ('Bedroom 3', 'bedroom_3'), ('Bathroom 1', 'bathroom_1'), ('Bathroom 2', 'bathroom_2')] -%}
        {%- set days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'] -%}
        {%- set ns = namespace(rows=['| Room | mo | tu | we | th | fr | sa | su |',
                                     '|:--|:-:|:-:|:-:|:-:|:-:|:-:|:-:|']) -%}
        {%- for name, k in rooms -%}
          {%- set ns2 = namespace(cells=[]) -%}
          {%- for d in days -%}
            {%- set ns3 = namespace(blocks=[]) -%}
            {%- for b in schedule.get('schedule.heating_' ~ k, {}).get(d, []) -%}
              {%- set end = (b['to'] | string)[:5] -%}
              {%- set ns3.blocks = ns3.blocks + [(b['from'] | string)[:5] ~ '–' ~ ('24:00' if end in ['00:00', '23:59'] else end)] -%}
            {%- endfor -%}
            {%- set ns2.cells = ns2.cells + [ns3.blocks | join('<br>') if ns3.blocks else '–'] -%}
          {%- endfor -%}
          {%- set link = '/heating/schedules?more-info-entity-id=schedule.heating_' ~ k ~ '&more-info-view=settings' -%}
          {%- set ns.rows = ns.rows + ['| [' ~ name ~ '](' ~ link ~ ') | ' ~ (ns2.cells | join(' | ')) ~ ' |'] -%}
        {%- endfor -%}
        {{ ns.rows | join('\n') }}
  sensor:
  - name: Heating schedules
    unique_id: heating_schedules
    icon: mdi:calendar-week
    state: '{{ schedule | count }}'
    attributes:
      table: '{{ table }}'
  binary_sensor:
  - name: Heating in block Living & kitchen
    unique_id: heating_in_block_living_kitchen
    icon: mdi:calendar-clock
    state: '{{ ''living_kitchen'' in in_block }}'
  - name: Heating in block Office 1
    unique_id: heating_in_block_office_1
    icon: mdi:calendar-clock
    state: '{{ ''office_1'' in in_block }}'
  - name: Heating in block Office 2
    unique_id: heating_in_block_office_2
    icon: mdi:calendar-clock
    state: '{{ ''office_2'' in in_block }}'
  - name: Heating in block Bedroom 1
    unique_id: heating_in_block_bedroom_1
    icon: mdi:calendar-clock
    state: '{{ ''bedroom_1'' in in_block }}'
  - name: Heating in block Bedroom 2
    unique_id: heating_in_block_bedroom_2
    icon: mdi:calendar-clock
    state: '{{ ''bedroom_2'' in in_block }}'
  - name: Heating in block Bedroom 3
    unique_id: heating_in_block_bedroom_3
    icon: mdi:calendar-clock
    state: '{{ ''bedroom_3'' in in_block }}'
  - name: Heating in block Bathroom 1
    unique_id: heating_in_block_bathroom_1
    icon: mdi:calendar-clock
    state: '{{ ''bathroom_1'' in in_block }}'
  - name: Heating in block Bathroom 2
    unique_id: heating_in_block_bathroom_2
    icon: mdi:calendar-clock
    state: '{{ ''bathroom_2'' in in_block }}'
